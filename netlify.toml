[build]
  command = "npm run build"
  publish = "dist"

# public/_redirects is generated at build time by scripts/gen-redirects.mjs.
# The SPA fallback (/* -> /index.html) is ALWAYS written, independent of the
# Jellyfin proxy. The /jellyfin/* proxy rule is only added when
# VITE_JELLYFIN_URL is set in Netlify's Site settings -> Environment
# variables (Netlify doesn't support env var interpolation directly inside
# netlify.toml/_redirects, hence the generator script).
